[project]
name = "poc-cidrallocator"
version = "0.1.0"
description = "Proof-of-concept IPv4 CIDR allocator that keeps allocations contiguous, with an interactive CLI demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "flask>=3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
